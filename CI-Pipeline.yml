pool:
  name: Doctor Agent Pool

trigger:
  branches:
    include:
      - develop

pr: none

variables:
- group: Sonar-secrets
- group: aws-secrets

- name: ECR_REPO_NAME
  value: doctor-app

- name: IMAGE_TAG
  value: $(Build.BuildId)

- name: ECR_REPO_URI
  value: $(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com/$(ECR_REPO_NAME)

stages:
- stage: CI
  displayName: "Build & Push Image"

  jobs:
  - job: Build
    steps:

    - checkout: self
      clean: true

    - script: docker system prune -af

    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - script: npm ci

    - script: |
        CI=true npm test -- --coverage --watchAll=false

    - script: |
        /opt/sonar-scanner/bin/sonar-scanner \
        -Dsonar.host.url=$(SONAR_HOST_URL) \
        -Dsonar.login=$(SONAR_TOKEN)

    - script: |
        export NODE_OPTIONS=--max-old-space-size=1024
        npm run build

    - script: rm -rf node_modules

    - script: docker build -t $(ECR_REPO_NAME):$(IMAGE_TAG) .

    - script: |
        aws configure set aws_access_key_id $(AWS_ACCESS_KEY_ID)
        aws configure set aws_secret_access_key $(AWS_SECRET_ACCESS_KEY)
        aws configure set default.region $(AWS_REGION)

    - script: |
        aws ecr get-login-password --region $(AWS_REGION) | \
        docker login --username AWS \
        --password-stdin $(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com

    - script: |
        docker tag $(ECR_REPO_NAME):$(IMAGE_TAG) $(ECR_REPO_URI):$(IMAGE_TAG)
        docker tag $(ECR_REPO_NAME):$(IMAGE_TAG) $(ECR_REPO_URI):latest

    - script: |
        docker push $(ECR_REPO_URI):$(IMAGE_TAG)
        docker push $(ECR_REPO_URI):latest
