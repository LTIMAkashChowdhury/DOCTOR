# =========================================
# PR VALIDATION PIPELINE (WITH COVERAGE)
# =========================================
 
trigger: none
 
pr:
  branches:
    include:
      - develop
 
pool:
  name: Doctor Agent Pool
 
# 🔐 Variables
variables:
- group: sonar-secrets
 
steps:
 
# -----------------------------------------
# 1. SETUP NODE
# -----------------------------------------
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: "Install Node.js"
 
# -----------------------------------------
# 2. INSTALL DEPENDENCIES
# -----------------------------------------
- script: npm install
  displayName: "Install Dependencies"
 
# -----------------------------------------
# 3. LINT CHECK (COMMENTED FOR NOW)
# -----------------------------------------
# - script: npm run lint
#   displayName: "Lint Check"
 
# -----------------------------------------
# 4. UNIT TEST WITH COVERAGE
# -----------------------------------------
- script: CI=true npm test -- --coverage --watchAll=false
  displayName: "Run Unit Tests with Coverage"
 
# -----------------------------------------
# 5. BUILD VALIDATION
# -----------------------------------------
- script: npm run build
  displayName: "Build Application"
 
# -----------------------------------------
# 6. SONARQUBE SCAN
# -----------------------------------------
- script: |
    /opt/sonar-scanner/bin/sonar-scanner \
      -Dsonar.host.url=$(SONAR_HOST_URL) \
      -Dsonar.login=$(SONAR_TOKEN)
  displayName: "SonarQube Scan"
 
# -----------------------------------------
# 7. WAIT FOR SONAR PROCESSING
# -----------------------------------------
- script: |
    echo "Waiting for SonarQube processing..."
    sleep 15
  displayName: "Wait for Sonar Processing"
 
# -----------------------------------------
# 8. QUALITY GATE CHECK
# -----------------------------------------
- script: |
    echo "Checking SonarQube Quality Gate..."

    RESPONSE=$(curl -s -u $(SONAR_TOKEN): \
    "$(SONAR_HOST_URL)/api/qualitygates/project_status?projectKey=Doctor")

    echo "Raw Response:"
    echo "$RESPONSE"

    # Validate JSON
    echo "$RESPONSE" | jq . > /dev/null 2>&1
    if [ $? -ne 0 ]; then
      echo "❌ Invalid JSON response (likely auth or URL issue)"
      exit 1
    fi

    STATUS=$(echo "$RESPONSE" | jq -r '.projectStatus.status')

    echo "Quality Gate Status: $STATUS"

    if [ "$STATUS" != "OK" ]; then
      echo "❌ Quality Gate Failed"
      exit 1
    else
      echo "✅ Quality Gate Passed"
    fi
  displayName: "Enforce Quality Gate"
