trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

pool:
  name: Doctor Agent Pool  # self-hosted agent

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'

- script: |
    npm install
  displayName: "Install Dependencies"

- script: |
    npm run build
  displayName: "Build React App"

- script: |
    npm test -- --watchAll=false
  displayName: "Run Unit Tests"
